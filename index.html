<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Primary Meta Tags -->
    <title>GlobID — Global Worker Identity for Cross-Border Hiring</title>
    <meta name="description" content="GlobID is a global worker identity platform that helps companies hire internationally with speed, clarity, and compliance. Built for MENA." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://globid.co/" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GlobID" />
    <meta property="og:title" content="GlobID — Global Worker Identity for Cross-Border Hiring" />
    <meta property="og:description" content="GlobID is a global worker identity platform that helps companies hire internationally with speed, clarity, and compliance. Built for MENA." />
    <meta property="og:url" content="https://globid.co/" />
    <meta property="og:image" content="https://globid.co/icon-512.png" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlobID — Global Worker Identity for Cross-Border Hiring" />
    <meta name="twitter:description" content="GlobID is a global worker identity platform that helps companies hire internationally with speed, clarity, and compliance. Built for MENA." />
    <meta name="twitter:image" content="https://globid.co/icon-512.png" />
    
    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "GlobID",
      "url": "https://globid.co",
      "logo": "https://globid.co/icon-512.png",
      "description": "Global worker identity and compliance infrastructure",
      "sameAs": [
        "https://www.linkedin.com/company/globid"
      ]
    }
    </script>
    
    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "GlobID",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free access with paid onboarding for individuals"
      }
    }
    </script>
    
    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GlobID",
      "url": "https://globid.co",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://globid.co/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- JSON-LD: SiteNavigationElement -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "itemListElement": [
        {
          "@type": "SiteNavigationElement",
          "position": 1,
          "name": "Dashboard",
          "url": "https://globid.co/dashboard"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 2,
          "name": "What is GlobID",
          "url": "https://globid.co/what-is-globid"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 3,
          "name": "For Employers",
          "url": "https://globid.co/hire-international-talent"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 4,
          "name": "Hire in MENA",
          "url": "https://globid.co/hire-in-mena"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 5,
          "name": "Hire in Africa",
          "url": "https://globid.co/hire-in-africa"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 6,
          "name": "Book a Demo",
          "url": "https://globid.co/demo"
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
