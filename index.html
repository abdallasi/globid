<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Primary Meta Tags -->
    <title>GlobID | Universal Employment ID for Global Remote Work</title>
    <meta name="description" content="GlobID helps global workers verify their identity and get trusted by international employers. Pre-employment compliance for MENA, Africa & emerging markets." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://globid.co/" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GlobID" />
    <meta property="og:title" content="GlobID | Universal Employment ID" />
    <meta property="og:description" content="GlobID helps global workers verify their identity and get trusted by international employers." />
    <meta property="og:url" content="https://globid.co/" />
    <meta property="og:image" content="https://globid.co/og-image.png" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlobID | Universal Employment ID" />
    <meta name="twitter:description" content="GlobID helps global workers verify their identity and get trusted by international employers." />
    <meta name="twitter:image" content="https://globid.co/og-image.png" />
    
    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "GlobID",
      "url": "https://globid.co",
      "logo": "https://globid.co/favicon.png",
      "description": "Universal employment ID and verification platform for global remote work",
      "sameAs": []
    }
    </script>
    
    <!-- Structured Data: WebSite with Sitelinks Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "GlobID",
      "url": "https://globid.co",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://globid.co/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Structured Data: SiteNavigationElement for Sitelinks -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "itemListElement": [
        {
          "@type": "SiteNavigationElement",
          "position": 1,
          "name": "Dashboard",
          "url": "https://globid.co/dashboard"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 2,
          "name": "Get Verified",
          "url": "https://globid.co/verify"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 3,
          "name": "Manifesto",
          "url": "https://globid.co/manifesto"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 4,
          "name": "For Employers",
          "url": "https://globid.co/hire-international-talent"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 5,
          "name": "MENA & Africa",
          "url": "https://globid.co/mena-remote-work"
        },
        {
          "@type": "SiteNavigationElement",
          "position": 6,
          "name": "Book a Demo",
          "url": "https://globid.co/demo"
        }
      ]
    }
    </script>
    
    <!-- Structured Data: Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "name": "GlobID Verification",
      "serviceType": "Identity Verification",
      "provider": {
        "@type": "Organization",
        "name": "GlobID"
      },
      "description": "Universal employment ID and verification for remote workers"
    }
    </script>
    
    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is GlobID?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GlobID is a universal employment ID platform that helps global workers verify their identity and get trusted by international employers."
          }
        },
        {
          "@type": "Question",
          "name": "How does GlobID verification work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Workers create a profile, upload required documents, complete verification, and receive a verified employment passport that can be shared with employers worldwide."
          }
        },
        {
          "@type": "Question",
          "name": "What regions does GlobID support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GlobID supports professionals from MENA, Africa, India, and Canada."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
